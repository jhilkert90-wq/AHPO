reset_characteristic_map:
  name: "AHPO: Reset characteristic map"
  description: Clears all learned characteristic-map cells.

reset_confidence:
  name: "AHPO: Reset confidence"
  description: Resets the confidence score of every cell to zero (keeps the learned data).

set_phase_override:
  name: "AHPO: Set phase override"
  description: >-
    Force Phase A (passive) or Phase B (active) globally, or return to automatic
    per-cell confidence-based switching.
  fields:
    phase:
      name: Phase
      description: automatic, passive, or active.
      required: true
      selector:
        select:
          options:
            - automatic
            - passive
            - active

export_characteristic_map:
  name: "AHPO: Export characteristic map"
  description: Writes the current characteristic map to a JSON file.
  fields:
    path:
      name: Path
      description: Absolute file path to write.
      required: true
      selector:
        text:
